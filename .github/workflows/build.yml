name: Build Clean Your Mind

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -A x64
          fi

      - name: Build
        shell: bash
        run: cmake --build build --config Release --target CleanYourMind --parallel 4

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          ART=build/CleanYourMind_artefacts/Release
          if [ "$RUNNER_OS" == "macOS" ]; then
            cp -R "$ART/Clean Your Mind.app" out/
            codesign --force --deep -s - "out/Clean Your Mind.app" || true
          else
            cp "$ART/Clean Your Mind.exe" out/
          fi
          cp "Installer/HOW TO INSTALL.txt" out/
          cd out
          if [ "$RUNNER_OS" == "macOS" ]; then
            ditto -c -k --keepParent . "../CleanYourMind-macOS.zip"
          else
            7z a -tzip "../CleanYourMind-Windows.zip" . > /dev/null
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourMind-${{ matrix.name }}
          path: out/

      - name: Publish to the "latest" release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Clean Your Mind (latest build)" --notes "Fresh build from the main branch. Download the zip for your system." --prerelease
          gh release upload latest CleanYourMind-*.zip --clobber
